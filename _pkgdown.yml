url: https://ecomods.github.io/patternscaper/
template:
  bootstrap: 5
  light-switch: true

reference:
- title: Package overview
  contents:
  - patternscaper

- title: Landscape creation
  desc: Functions for generating artificial landscapes with different spatial patterns
  contents:
  - create_landscape
  - create_landscapes

- title: Pattern parameters
  desc: >
    One constructor per pattern, holding that pattern's parameters. Pass the result to
    create_landscape(params = ...) or create_landscapes(params_list = ...).
  contents:
  - pattern_random
  - pattern_bare
  - pattern_dense
  - pattern_sharp
  - pattern_diffuse
  - pattern_fingers
  - pattern_clustered
  - pattern_bands
  - pattern_spots
  - pattern_gaps
  - pattern_labyrinth

- title: Landscape objects
  desc: Functions for creating and manipulating landscape objects
  contents:
  - landscape
  - plot.landscape
  - print.landscape
  - set_landscape_name
  - set_landscape_pattern

- title: Landscape metrics
  desc: Calculate and evaluate landscape metrics
  contents:
  - calculate_metrics
  - evaluate_metrics
  - print.metrics_evaluation

- title: Neural network training
  desc: Train neural network classifiers
  contents:
  - train_metric_model
  - train_pixel_model
  - set_random_seed

- title: Neural network application
  desc: Apply trained classifiers to new landscapes
  contents:
  - apply_metric_model
  - apply_pixel_model

- title: Model persistence
  desc: Save and reload trained classifiers
  contents:
  - save_pixel_model
  - load_pixel_model

- title: Visualization
  desc: Plot landscapes, metrics, and classification results
  contents:
  - plot_landscapes
  - plot_classified_landscapes
  - plot_metrics

articles:
- title: Classification workflows
  contents:
  - classify-metrics
  - classify-pixels

- title: Prepare landscapes
  contents:
  - landscape-generation
  - pattern-gallery
  - importing-landscapes
  - matching-training-application

- title: Supporting guides
  contents:
  - landscape-metrics
  - install-keras

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, github, lightswitch]
  components:
    articles:
      text: Guides
      menu:
      - text: Classification workflows
      - text: "Classify with landscape metrics"
        href: articles/classify-metrics.html
      - text: "Classify with raster cells"
        href: articles/classify-pixels.html
      - text: "-------"
      - text: Prepare landscapes
      - text: "Create artificial landscapes"
        href: articles/landscape-generation.html
      - text: "Pattern gallery"
        href: articles/pattern-gallery.html
      - text: "Import user-defined landscapes"
        href: articles/importing-landscapes.html
      - text: "Match training and application landscapes"
        href: articles/matching-training-application.html
      - text: "-------"
      - text: Supporting guides
      - text: "Calculate and evaluate landscape metrics"
        href: articles/landscape-metrics.html
      - text: "Set up Keras and TensorFlow"
        href: articles/install-keras.html
      - text: "-------"
      - text: "All guides"
        href: articles/index.html
